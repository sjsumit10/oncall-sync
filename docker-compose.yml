services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://oncall_app:oncall_app@postgres:5432/oncall
      DATABASE_ADMIN_URL: postgresql+asyncpg://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./backend:/srv"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: arq app.worker.arq_app.WorkerSettings --watch app
    env_file: [.env]
    # Prometheus scrape target: the worker does the reconciling, so its counters
    # are the ones that matter.
    ports: ["${WORKER_METRICS_PORT:-9100}:9100"]
    environment:
      DATABASE_URL: postgresql+asyncpg://oncall_app:oncall_app@postgres:5432/oncall
      DATABASE_ADMIN_URL: postgresql+asyncpg://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/srv"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
