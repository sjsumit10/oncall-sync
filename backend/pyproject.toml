[project]
name = "oncall-sync"
version = "0.1.0"
description = "Sync on-call schedules to chat group handles"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
    "certifi>=2024.8.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "freezegun>=1.5",
    "testcontainers[postgres]>=4.8",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory otherwise shadows the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# Role and privilege DDL cannot be parameterized. bootstrap_db.py regex-validates
# the role name and quote-escapes the password, both from local configuration.
"scripts/bootstrap_db.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine and Redis client are module-level singletons bound to the loop that
# created them, so the whole session shares one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The load tests seed a thousand rules; run them explicitly with -m slow.
markers = ["slow: scale and load checks, excluded from the default run"]
addopts = "-m 'not slow'"
